<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>服务导航中心</title>
    <style>
      :root {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --hover-border: #94a3b8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 1100px;
        width: 100%;
      }
      .header {
        text-align: center;
        margin-bottom: 50px;
      }
      .header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 12px;
        letter-spacing: -0.5px;
        color: var(--text-main);
      }
      .header p {
        color: var(--text-muted);
        font-size: 1.1rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 24px;
      }
      .card {
        background: var(--card-bg);
        border-radius: 16px;
        padding: 32px 24px;
        text-decoration: none;
        color: inherit;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.05),
          0 2px 4px -2px rgba(0, 0, 0, 0.05);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        border: 1px solid #e2e8f0;
        position: relative;
        overflow: hidden;
      }
      .card:hover {
        transform: translateY(-6px);
        box-shadow:
          0 12px 20px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -4px rgba(0, 0, 0, 0.05);
        border-color: var(--hover-border);
      }
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .card:hover::before {
        opacity: 1;
      }
      .icon {
        font-size: 3.5rem;
        margin-bottom: 20px;
        line-height: 1;
      }
      .card h2 {
        font-size: 1.3rem;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .card p {
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }

      @media (max-width: 600px) {
        .header h1 {
          font-size: 2rem;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🌐 服务导航中心</h1>
        <p>基于 Caddy 驱动的个人网络服务聚合页</p>
      </div>
      <div class="grid">
        <a href="http://10.0.0.12:6868" class="card">
          <div class="icon">📥</div>
          <h2>下载</h2>
        </a>
        <a href="http://10.0.0.15:9091" class="card">
          <div class="icon">🧲</div>
          <h2>磁力</h2>
        </a>
        <a href="http://10.0.0.12:8080" class="card">
          <div class="icon">🗂️</div>
          <h2>文件存储</h2>
        </a>
        <a href="http://10.0.0.12:5244" class="card">
          <div class="icon">☁️</div>
          <h2>网盘服务</h2>
        </a>
        <a href="http://10.0.0.12:3001" class="card">
          <div class="icon">🤖</div>
          <h2>大语言模型</h2>
        </a>
        <a href="http://10.0.0.12:8923" class="card">
          <div class="icon">📆</div>
          <h2>签到</h2>
        </a>
        <a href="http://10.0.0.12:5700" class="card">
          <div class="icon">🐉</div>
          <h2>青龙</h2>
        </a>
        <a href="http://10.0.0.12:5140/player" class="card">
          <div class="icon">📺</div>
          <h2>电视直播</h2>
        </a>
      </div>
    </div>
  </body>
</html>
